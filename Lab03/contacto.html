    <main>
    <h1>Contacto</h1>
    <form action="#" method="POST"> <!--se usa el # dado que la info no se envía a ningún servidor se usa Post para que el mensaje no se vea en la barra de direcciones-->  
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
        </p>
        
        <p>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Correo Electrónico" required>
        </p>

        <p>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </p>
        
        <p>
            <button type="submit">Enviar</button>
        </p>
    </form>
</main>
</body>
</html>
