<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - DEY Online Store</title>
    <!-- Bootstrap CSS (v5.3.8) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN CON LOGO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dey">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.jpeg" alt="DEY Online Store Logo" height="65" class="rounded-circle shadow-sm">
                <span class="brand-text-dey fw-bold">DEY</span>
                <span class="fs-6 font-monospace d-none d-sm-inline">Online Store</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ayuda.html">Ayuda</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5">
        
        <!-- ENCABEZADO DE SECCIÓN -->
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold text-dey-blue">Contáctanos</h2>
            <p class="lead text-muted col-md-8 mx-auto">
                ¿Tienes alguna duda, consulta o sugerencia? Completa el siguiente formulario y nuestro equipo de <strong>DEY Online Store</strong> te responderá lo antes posible.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- TARJETA DEL FORMULARIO DE CONTACTO -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dey text-white py-3">
                        <h4 class="card-title mb-0 fw-bold fs-5">
                            <i class="bi bi-envelope-paper me-2"></i> Formulario de Mensaje
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="#" method="POST">
                            
                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                                </div>
                            </div>
                            
                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required>
                                </div>
                            </div>

                            <!-- Mensaje -->
                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje o consulta detallada aquí..." required></textarea>
                            </div>
                            
                            <!-- Botones -->
                            <div class="d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-light border">Limpiar</button>
                                <button type="submit" class="btn btn-dey-pink px-4 fw-bold">
                                    <i class="bi bi-send me-1"></i> Enviar Mensaje
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0 fs-6">&copy; 2026 DEY Online Store - Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS Bundle (v5.3.8) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Tu script de conexión -->
    <script src="contacto.js" type="module"></script>
</body>
</html>
