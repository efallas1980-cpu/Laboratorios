<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuenta - DEY Online Store</title>
    <!-- Bootstrap CSS (v5.3.8) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dey">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.jpeg" alt="DEY Online Store Logo" height="50" class="rounded-circle shadow-sm">
                <span class="brand-text-dey fw-bold">DEY</span>
                <span class="fs-6 font-monospace d-none d-sm-inline">Online Store</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL (REGISTRO) -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dey-blue">Crear una Cuenta</h3>
                            <p class="text-muted small">Regístrate para comenzar a comprar en DEY Online Store</p>
                        </div>

                        <form id="registroForm">
                            <!-- Nombre completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre y apellido" required>
                                </div>
                            </div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="usuario@correo.com" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                                </div>
                            </div>
                            <!-- Confirmar Contraseña -->
                            <div class="mb-4">
                            <label for="passwordConfirm" class="form-label fw-semibold">Confirmar Contraseña</label>
                            <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="passwordConfirm" placeholder="Repite tu contraseña" required minlength="6">
                            </div>
                            </div>
                            <!-- Botón de Registro -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dey-pink py-2 fw-bold">
                                    <i class="bi bi-person-plus me-1"></i> Registrarse
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <p class="small text-muted">¿Ya tienes una cuenta? <a href="login.html" class="text-decoration-none fw-semibold">Inicia sesión aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 fs-6">&copy; 2026 DEY Online Store - Todos los derechos reservados.</p>
    </footer>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script de registro -->
    <script src="registro.js" type="module"></script>
</body>
</html>
