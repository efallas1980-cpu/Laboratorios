<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes Recibidos - DEY Online Store</title>
    <!-- Bootstrap CSS (v5.3.8) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dey">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.jpeg" alt="DEY Online Store Logo" height="50" class="rounded-circle shadow-sm">
                <span class="brand-text-dey fw-bold">DEY</span>
                <span class="fs-6 font-monospace d-none d-sm-inline">Admin Panel</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mensajes.html">Bandeja de Mensajes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dey-blue">Mensajes de Contacto Recibidos</h2>
                <p class="text-muted mb-0">Consulta en tiempo real los mensajes enviados por los clientes.</p>
            </div>
            <button id="btnActualizar" class="btn btn-outline-primary">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
            </button>
        </div>

        <!-- TABLA DE MENSAJES -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="py-3 ps-3">Nombre</th>
                                <th class="py-3">Correo</th>
                                <th class="py-3">Mensaje</th>
                                <th class="py-3">Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyMensajes">
                            <!-- Los mensajes se cargarán dinámicamente con JavaScript -->
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">Cargando mensajes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0 fs-6">&copy; 2026 DEY Online Store - Panel de Administración</p>
    </footer>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script de lógica -->
    <script src="mensajes.js" type="module"></script>
</body>
</html>
