<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DEY Online Store</title>
    <!-- Bootstrap CSS (v5.3.8) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dey">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.jpeg" alt="DEY Online Store Logo" height="50" class="rounded-circle shadow-sm">
                <span class="brand-text-dey fw-bold">DEY</span>
                <span class="fs-6 font-monospace d-none d-sm-inline">Online Store</span>
            </a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL (LOGIN) -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dey-blue">Iniciar Sesión</h3>
                            <p class="text-muted small">Ingresa a tu cuenta de DEY Online Store</p>
                        </div>

                        <form id="loginForm">
                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="usuario@correo.com" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Botón de Acceso -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dey-pink py-2 fw-bold">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 fs-6">&copy; 2026 DEY Online Store - Todos los derechos reservados.</p>
    </footer>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script de autenticación -->
    <script src="login.js" type="module"></script>
</body>
</html>
